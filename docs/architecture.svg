<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="14" fill="#0d1117"/>

  <!-- PREFILL SIDE -->
  <rect x="28" y="48" width="300" height="236" rx="12" fill="#161b22" stroke="#76b900" stroke-width="2"/>
  <text x="178" y="80" text-anchor="middle" fill="#76b900" font-size="15" font-weight="700">PREFILL · CUDA</text>
  <text x="178" y="102" text-anchor="middle" fill="#c9d1d9" font-size="12">2× DGX Spark (GB10) · vLLM TP2 · FP8</text>
  <rect x="52" y="122" width="252" height="40" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="178" y="147" text-anchor="middle" fill="#e6edf3" font-size="12">DeepSeek-V4-Flash  ·  ~2,050 tok/s</text>
  <rect x="52" y="174" width="252" height="92" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="178" y="196" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="600">capture hook (sitecustomize)</text>
  <text x="178" y="216" text-anchor="middle" fill="#c9d1d9" font-size="11">takes each layer's attention input, applies the</text>
  <text x="178" y="232" text-anchor="middle" fill="#c9d1d9" font-size="11">DECODER's projection + pooling math on the GPU,</text>
  <text x="178" y="248" text-anchor="middle" fill="#c9d1d9" font-size="11">emits the decoder's finished cache pools</text>

  <!-- LINK -->
  <line x1="332" y1="166" x2="616" y2="166" stroke="#8b949e" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="384" y="118" width="180" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
  <text x="474" y="140" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">plain 10 GbE</text>
  <text x="474" y="192" text-anchor="middle" fill="#8b949e" font-size="12">~10 KB / token</text>
  <text x="474" y="210" text-anchor="middle" fill="#8b949e" font-size="12">1.0 GB for 105K tokens · 1.2 s</text>
  <text x="474" y="236" text-anchor="middle" fill="#6e7681" font-size="11">no RDMA · no Thunderbolt · no shared cache format</text>

  <!-- DECODE SIDE -->
  <rect x="632" y="48" width="300" height="236" rx="12" fill="#161b22" stroke="#a5a5a5" stroke-width="2"/>
  <text x="782" y="80" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">DECODE · Metal</text>
  <text x="782" y="102" text-anchor="middle" fill="#c9d1d9" font-size="12">Mac Studio M3 Ultra · oMLX · MXFP4</text>
  <rect x="656" y="122" width="252" height="40" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="782" y="147" text-anchor="middle" fill="#e6edf3" font-size="12">same model  ·  23–25 tok/s decode</text>
  <rect x="656" y="174" width="252" height="92" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="782" y="196" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="600">front door → SSD prefix cache</text>
  <text x="782" y="216" text-anchor="middle" fill="#c9d1d9" font-size="11">assembles the pools into MLX cache objects,</text>
  <text x="782" y="232" text-anchor="middle" fill="#c9d1d9" font-size="11">writes them as oMLX's OWN block files —</text>
  <text x="782" y="248" text-anchor="middle" fill="#c9d1d9" font-size="11">oMLX sees a normal prefix hit and only decodes</text>

  <!-- FOOTER -->
  <text x="480" y="312" text-anchor="middle" fill="#8b949e" font-size="12">cold 105K-token prompt: 245.6 s on the Mac alone → 75.5 s bridged (3.3×) · decode rate unchanged · bridged answers 5/5 on the judged eval</text>
</svg>
